name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: '18.20.4'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ---- YAML anchors to avoid duplication ----
x-checkout: &checkout
  name: Checkout source code
  uses: actions/checkout@v4

x-setup-node: &setup_node
  name: Setup Node.js
  uses: actions/setup-node@v4
  with:
    node-version: ${{ env.NODE_VERSION }}
    cache: 'npm'

x-npm-ci: &npm_ci
  name: Install dependencies
  run: npm ci

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04
    steps:
      - *checkout
      - *setup_node
      - *npm_ci
      - name: Run linter
        run: npm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-22.04
    steps:
      - *checkout
      - *setup_node
      - *npm_ci
      - name: Type check
        run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-22.04
    steps:
      - *checkout
      - *setup_node
      - *npm_ci
      - name: Run unit tests
        run: npm run test -- --ci --coverage
        # Nếu bạn đang bị flaky test (lúc pass lúc fail), bật 2 flag dưới:
        # run: npm run test -- --ci --coverage --runInBand --detectOpenHandles

  build:
    name: Build
    runs-on: ubuntu-22.04
    needs: [lint, typecheck]
    steps:
      - *checkout
      - *setup_node
      - *npm_ci
      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  security-scan:
    name: Security Scan
    runs-on: ubuntu-22.04
    needs: [lint, typecheck]
    steps:
      - name: Checkout source code (full history for secret scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - *setup_node
      - *npm_ci

      - name: Dependency vulnerability scan (PR: non-blocking)
        if: ${{ github.event_name == 'pull_request' }}
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Dependency vulnerability scan (push: blocking)
        if: ${{ github.event_name == 'push' }}
        run: npm audit --audit-level=moderate

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build-pr:
    name: Docker Build (PR, no push)
    runs-on: ubuntu-22.04
    needs: [build, test, security-scan]
    if: ${{ github.event_name == 'pull_request' }}
    steps:
      - *checkout
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-22.04
    needs: [build, test, security-scan]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}

    permissions:
      contents: read
      packages: write

    steps:
      - *checkout
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
